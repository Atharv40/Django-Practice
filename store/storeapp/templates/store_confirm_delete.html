<!DOCTYPE html>
<html>
<head>
    <title>Delete Store</title>
</head>
<body>
    <h1>Are you sure you want to delete "{{ store.name }}"?</h1>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
    </form>
    <a href="{% url 'store-list' %}">Cancel</a>
</body>
</html>
