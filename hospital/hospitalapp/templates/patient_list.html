<!DOCTYPE html>
<html>
<head>
    <title>Patient List</title>
</head>
<body>
    <h1>Patient List</h1>
    <a href="{% url 'patient_create' %}">Add New Patient</a>
    <ul>
        {% for patient in patients %}
        <li>
            {{ patient.name }} - {{ patient.age }} years - {{ patient.disease }}
            <a href="{% url 'patient_update' patient.id %}">Edit</a>
            <a href="{% url 'patient_delete' patient.id %}">Delete</a>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
